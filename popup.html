<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Resume Optimizer</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px 0;
      opacity: 0.9;
    }
    button {
      width: 100%;
      background: white;
      color: #667eea;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.02);
    }
    .secondary {
      background: transparent;
      color: white;
      border: 2px solid white;
    }
    .status {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 15px;
    }
    .user-status {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>🚀 Resume Optimizer</h1>
  <p>Optimize your resume for any job in seconds!</p>
  
  <div class="status" id="status">
    <div class="user-status" id="user-status">Loading...</div>
    <span id="credits-text"></span>
  </div>
  
  <button id="open-sidebar">Open Optimizer</button>
  <button class="secondary" id="view-credits">View Credits</button>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
